<!-- Testes de lógica pura (rode headless; ver CLAUDE.md > Verificação).
     Carrega os js/*.js e chama funções puras com fixtures. NÃO cobre OAuth/OCR/PDF/Drive. -->

<script src="../js/render.js"></script>

</head><body><pre id="out">PENDING</pre>
<script>
var out = [], fail = 0;
function chk(name, got, exp){ var ok = String(got) === String(exp); if(!ok) fail++; out.push((ok?'PASS ':'FAIL ')+name+' => got['+got+'] exp['+exp+']'); }

try {
  // computeSantanderPeriodo
  chk('periodo_com_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[{alelo:[{data:'2026-05-28'}]},{alelo:[]}] }),
    '28/05/2026 a 20/06/2026');
  chk('periodo_sem_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[] }),
    '05/06/2026 a 20/06/2026');
  chk('periodo_vazio', computeSantanderPeriodo({ alelo:[], history:[] }), '');

  // validateBeforeExport (confirm mockado)
  window.confirm = function(){ return false; };
  chk('valida_ok',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:10,estabelecimento:'X',justificativa:'Y'}], reembolso:[] }, {alelo:true,reembolso:false}),
    'true');
  chk('valida_falha',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:0,estabelecimento:'',justificativa:''}], reembolso:[] }, {alelo:true,reembolso:false}),
    'false');

  // mergeDocs: perfil last-write-wins (profileUpdatedAt) + tabela por maior updatedAt
  function doc(profTs, func, reemb, tombReemb, reportMonths){
    return { meta:{profileUpdatedAt:profTs, updatedAt:profTs}, funcionario:func, dataSolicitacao:'', referente:'',
      reportMonths:reportMonths||{reembolso:'',alelo:''}, bank:{}, config:{categorias:[]}, reembolso:reemb||[], alelo:[],
      tomb:{reembolso:tombReemb||{}, alelo:{}}, history:[], histTomb:{}, driveFolders:{}, driveKnown:{}, driveDismissed:{}, pending:[] };
  }
  var a = doc(100, 'A', [{id:'x',data:'2026-01-01',valor:10,updatedAt:50}], {}, {reembolso:'2026-05',alelo:'2026-05'});
  var b = doc(200, 'B', [{id:'x',data:'2026-01-01',valor:99,updatedAt:80}], {}, {reembolso:'2026-06',alelo:'2026-07'});
  var m = mergeDocs(a, b);
  chk('merge_perfil_lww', m.funcionario, 'B');                 // 200 > 100
  chk('merge_tabela_maior_updatedAt', m.reembolso[0].valor, 99); // 80 > 50
  chk('merge_reportMonths_lww', m.reportMonths.reembolso + '|' + m.reportMonths.alelo, '2026-06|2026-07'); // perfil mais novo (b) vence

  // tombstone remove o lançamento (timestamps reais: lápide é purgada se < agora-180d)
  var NOW = Date.now();
  var c = doc(NOW, 'C', [{id:'x',data:'2026-01-01',valor:10,updatedAt:NOW - 5000}]);
  var d = doc(NOW, 'C', [], {x: NOW});   // lápide mais nova que o updatedAt, dentro da janela
  var m2 = mergeDocs(c, d);
  chk('merge_tombstone_remove', m2.reembolso.length, 0);
} catch(e){ fail++; out.push('THREW '+e.message); }

out.push(fail ? 'RESULT: FAIL ('+fail+')' : 'RESULT: PASS');
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
