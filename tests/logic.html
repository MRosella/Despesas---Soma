<!doctype html><html><head>
<!-- Testes de lógica pura (rode headless; ver CLAUDE.md > Verificação).
     Carrega os js/*.js e chama funções puras com fixtures. NÃO cobre OAuth/OCR/PDF/Drive. -->
<script src="../lib/fflate.min.js"></script>
<script src="../js/modules.js"></script>
<script src="../js/core.js"></script>
<script src="../js/render.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/excel.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/lock.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/ocr.js"></script>
<script src="../js/idb.js"></script>
<script src="../js/drive-core.js"></script>
<script src="../js/drive-scan.js"></script>
<script src="../js/main.js"></script>
</head><body><pre id="out">PENDING</pre>
<script>
var out = [], fail = 0;
function chk(name, got, exp){ var ok = String(got) === String(exp); if(!ok) fail++; out.push((ok?'PASS ':'FAIL ')+name+' => got['+got+'] exp['+exp+']'); }

try {
  // computeSantanderPeriodo
  chk('periodo_com_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[{alelo:[{data:'2026-05-28'}]},{alelo:[]}] }),
    '28/05/2026 a 20/06/2026');
  chk('periodo_sem_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[] }),
    '05/06/2026 a 20/06/2026');
  chk('periodo_vazio', computeSantanderPeriodo({ alelo:[], history:[] }), '');

  // santanderPeriodoText: usuario escolheu datas -> prevalece sobre o automatico
  chk('periodo_texto_usuario',
    santanderPeriodoText({ alelo:[{data:'2026-06-05'}], history:[], santPeriodo:{start:'2026-06-01', end:'2026-06-30'} }),
    '01/06/2026 a 30/06/2026');
  chk('periodo_texto_fallback',
    santanderPeriodoText({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[], santPeriodo:{start:'', end:''} }),
    '05/06/2026 a 20/06/2026');

  // validateBeforeExport (confirm mockado)
  window.confirm = function(){ return false; };
  chk('valida_ok',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:10,estabelecimento:'X',justificativa:'Y'}], reembolso:[] }, {alelo:true,reembolso:false}),
    'true');
  chk('valida_falha',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:0,estabelecimento:'',justificativa:''}], reembolso:[] }, {alelo:true,reembolso:false}),
    'false');

  // mergeDocs: perfil last-write-wins (profileUpdatedAt) + tabela por maior updatedAt
  function doc(profTs, func, reemb, tombReemb, reportMonths){
    var d = { meta:{profileUpdatedAt:profTs, updatedAt:profTs}, funcionario:func, dataSolicitacao:'', referente:'',
      reportMonths:reportMonths||mapPorTabela(function(){return '';}), bank:{}, config:{categorias:[]},
      tomb:mapPorTabela(function(){return {};}), history:[], histTomb:{}, driveFolders:{}, driveKnown:{}, driveDismissed:{}, pending:[] };
    TABELAS.forEach(function(t){ d[t] = []; });
    d.reembolso = reemb || [];
    d.tomb.reembolso = tombReemb || {};
    return d;
  }
  var a = doc(100, 'A', [{id:'x',data:'2026-01-01',valor:10,updatedAt:50}], {}, {reembolso:'2026-05',alelo:'2026-05',sagestao:''});
  var b = doc(200, 'B', [{id:'x',data:'2026-01-01',valor:99,updatedAt:80}], {}, {reembolso:'2026-06',alelo:'2026-07',sagestao:'2026-08'});
  var m = mergeDocs(a, b);
  chk('merge_perfil_lww', m.funcionario, 'B');                 // 200 > 100
  chk('merge_perfis_por_modulo', m.perfis.reembolso.funcionario + '|' + m.perfis.sagestao.funcionario, 'B|');
  chk('merge_reportMonths_terceiro', m.reportMonths.sagestao, '2026-08');
  chk('merge_terceira_tabela', Array.isArray(m.sagestao) + '|' + m.sagestao.length, 'true|0');
  chk('merge_tabela_maior_updatedAt', m.reembolso[0].valor, 99); // 80 > 50
  chk('merge_reportMonths_lww', m.reportMonths.reembolso + '|' + m.reportMonths.alelo, '2026-06|2026-07'); // perfil mais novo (b) vence

  // tombstone remove o lançamento (timestamps reais: lápide é purgada se < agora-180d)
  var NOW = Date.now();
  var c = doc(NOW, 'C', [{id:'x',data:'2026-01-01',valor:10,updatedAt:NOW - 5000}]);
  var d = doc(NOW, 'C', [], {x: NOW});   // lápide mais nova que o updatedAt, dentro da janela
  var m2 = mergeDocs(c, d);
  chk('merge_tombstone_remove', m2.reembolso.length, 0);

  // histBelongsTo: divisão dos relatórios arquivados por tipo (Reembolso × Cartão Santander)
  chk('hist_belongs_table_reemb', histBelongsTo({ table:'reembolso', reembolso:[{}], alelo:[] }, 'reembolso') + '|' + histBelongsTo({ table:'reembolso', reembolso:[{}], alelo:[] }, 'alelo'), 'true|false');
  chk('hist_belongs_table_alelo', histBelongsTo({ table:'alelo', reembolso:[], alelo:[{}] }, 'alelo') + '|' + histBelongsTo({ table:'alelo', reembolso:[], alelo:[{}] }, 'reembolso'), 'true|false');
  chk('hist_belongs_legado', histBelongsTo({ reembolso:[{}], alelo:[{}] }, 'reembolso') + '|' + histBelongsTo({ reembolso:[{}], alelo:[{}] }, 'alelo'), 'true|true');
  chk('hist_belongs_legado_so_reemb', histBelongsTo({ reembolso:[{}], alelo:[] }, 'alelo'), 'false');
  chk('hist_belongs_sagestao', histBelongsTo({ table:'sagestao', sagestao:[{}] }, 'sagestao') + '|' + histBelongsTo({ table:'sagestao', sagestao:[{}] }, 'reembolso'), 'true|false');

  // registry: chaves e módulos
  chk('registry_tabelas', TABELAS.join(','), 'reembolso,alelo,sagestao');
  chk('registry_modOf_fallback', modOf('inexistente').key, 'reembolso');
  chk('registry_pastas_distintas', new Set(MODULOS.map(function(m){return m.driveRoot;})).size, 3);
  chk('registry_prefixos_distintos', new Set(MODULOS.map(function(m){return m.fileBase;})).size, 3);

  // assinaturas do rodape do PDF: a SA nao imprime; Soma e cartao seguem imprimindo
  chk('assinatura_sa_removida', buildSignatureBlock(MOD.sagestao), '');
  chk('assinatura_soma_presente', buildSignatureBlock(MOD.reembolso).indexOf(MOD.reembolso.aprovador) >= 0, 'true');
  // rotulo do campo do nome: SA usa 'Prestador', os demais o padrao 'Funcionario'
  chk('rotulo_sa_prestador', MOD.sagestao.rotuloFuncionario, 'Prestador');
  chk('rotulo_soma_padrao', MOD.reembolso.rotuloFuncionario || 'padrao', 'padrao');

  // docForModule: achata o perfil do módulo na raiz (e deixa snapshot legado intacto)
  var comPerfis = { perfis:{ reembolso:{funcionario:'R', dataSolicitacao:'2026-06-01', referente:'', bank:{nome:'BR'}, santPeriodo:{start:'',end:''}},
                             sagestao:{funcionario:'S', dataSolicitacao:'2026-07-02', referente:'', bank:{nome:'BS'}, santPeriodo:{start:'',end:''}} } };
  chk('docForModule_reembolso', docForModule(comPerfis,'reembolso').funcionario + '|' + docForModule(comPerfis,'reembolso').bank.nome, 'R|BR');
  chk('docForModule_sagestao', docForModule(comPerfis,'sagestao').funcionario + '|' + docForModule(comPerfis,'sagestao').dataSolicitacao, 'S|2026-07-02');
  chk('docForModule_legado', docForModule({funcionario:'L'},'reembolso').funcionario, 'L');

  // resolveExport: um módulo -> formato dele; reembolso+cartão -> relatório combinado; empresas diferentes -> erro
  chk('export_so_cartao', resolveExport({alelo:true}).mod.key, 'alelo');
  chk('export_so_reembolso', resolveExport({reembolso:true}).mod.key, 'reembolso');
  chk('export_combinado', resolveExport({reembolso:true, alelo:true}).mod.key, 'reembolso');
  chk('export_so_sagestao', resolveExport({sagestao:true}).mod.key, 'sagestao');
  chk('export_mistura_invalida', !!resolveExport({reembolso:true, sagestao:true}).erro, 'true');
  chk('export_vazio', !!resolveExport({}).erro, 'true');

  // fileBaseOf usa o prefixo do módulo (reconhecido por isGeneratedArtifact)
  var dref = { funcionario:'Murilo Rosella', dataSolicitacao:'2026-07-31' };
  chk('filebase_reembolso', fileBaseOf(dref, MOD.reembolso), 'Relatorio_Despesas_Murilo_Rosella_2026-07-31');
  chk('filebase_cartao', fileBaseOf(dref, MOD.alelo), 'Prestacao_Contas_Cartao_Murilo_Rosella_2026-07-31');
  chk('filebase_sagestao', fileBaseOf(dref, MOD.sagestao), 'Relatorio_Despesas_SA_Murilo_Rosella_2026-07-31');
  chk('artefato_gerado_sagestao', isGeneratedArtifact({name:'Relatorio_Despesas_SA_Murilo_2026-07-31.pdf', mimeType:'application/pdf'}), 'true');
  chk('artefato_comprovante_nao', isGeneratedArtifact({name:'NF 12.07.2026.jpg', mimeType:'image/jpeg'}), 'false');

  // validação por módulo: SA Ambiental exige categoria (como o reembolso), não estabelecimento
  chk('valida_sagestao_ok',
    validateBeforeExport({ sagestao:[{data:'2026-07-01',valor:10,categoria:'Almoço'}] }, {sagestao:true}), 'true');
  chk('valida_sagestao_falha',
    validateBeforeExport({ sagestao:[{data:'2026-07-01',valor:10,categoria:''}] }, {sagestao:true}), 'false');

  // filteredDoc zera as tabelas não selecionadas
  var fd = filteredDoc({ reembolso:[{id:1}], alelo:[{id:2}], sagestao:[{id:3}] }, {sagestao:true});
  chk('filteredDoc', fd.reembolso.length + '|' + fd.alelo.length + '|' + fd.sagestao.length, '0|0|1');

  // migração de estado legado (cabeçalho/banco na raiz) -> perfis por módulo
  localStorage.setItem(STORE_KEY, JSON.stringify({
    funcionario:'Legado', dataSolicitacao:'2026-03-10', referente:'Demandas operacionais',
    bank:{nome:'Conta Legado', cpf:'123'}, santPeriodo:{start:'2026-03-01', end:'2026-03-31'},
    reembolso:[{id:'a',data:'2026-03-05',valor:5}], alelo:[], meta:{updatedAt:1, profileUpdatedAt:1}
  }));
  var mig = loadState();
  chk('migra_perfil_reembolso', mig.perfis.reembolso.funcionario + '|' + mig.perfis.reembolso.bank.nome, 'Legado|Conta Legado');
  chk('migra_periodo_cartao', mig.perfis.alelo.santPeriodo.start, '2026-03-01');
  chk('migra_terceira_tabela_vazia', Array.isArray(mig.sagestao) + '|' + mig.perfis.sagestao.funcionario, 'true|');
  chk('migra_sem_campos_na_raiz', (mig.funcionario === undefined) + '|' + (mig.bank === undefined), 'true|true');
  try { localStorage.removeItem(STORE_KEY); } catch(e){}

  // persistência do token do Drive: round-trip de token válido + rejeição de token expirado
  gdAccess = { token: 'tok123', exp: Date.now() + 100000 };
  saveGdAccess();
  chk('gdtoken_roundtrip', loadGdAccess().token, 'tok123');
  gdAccess = { token: 'tokOld', exp: Date.now() - 1000 };   // já expirado
  saveGdAccess();
  chk('gdtoken_expira', loadGdAccess().token, '');
  try { localStorage.removeItem(GDTOK_KEY); } catch(e){}

  // paleta por módulo: applyModuleAccent depende destes campos (hex) em TODOS os módulos
  var hex = /^#[0-9a-fA-F]{6}$/;
  var faltando = [];
  MODULOS.forEach(function(m){
    ['accent','accentDark','tint','tintInk','soft'].forEach(function(k){
      if (!hex.test(m[k] || '')) faltando.push(m.key + '.' + k);
    });
  });
  chk('paleta_modulos_completa', faltando.join(',') || 'ok', 'ok');
  // SA Ambiental: verde do logo (canal G maior que R e B), nada de vermelho da Soma
  var sa = MOD.sagestao.accent.toLowerCase();
  var rr = parseInt(sa.slice(1,3),16), gg = parseInt(sa.slice(3,5),16), bb = parseInt(sa.slice(5,7),16);
  chk('sa_accent_verde', (gg > rr && gg > bb) ? 'verde' : 'nao-verde', 'verde');
  chk('sa_pdf_verde', MOD.sagestao.pdf.accent.toLowerCase(), sa);
  chk('sa_excel_troca_vermelho', MOD.sagestao.excelColors['B3262D'].toLowerCase(), sa.slice(1));

  // pasta do Drive por "Referente à" (SA Ambiental fecha por voo, não por mês)
  chk('sanitize_pasta', sanitizeFolderName("  Voo 'A'/B" + String.fromCharCode(92) + 'C  "x"  '), 'Voo A B C x');
  chk('sanitize_vazio', sanitizeFolderName(null), '');
  state.perfis.sagestao.referente = 'Voo Fazenda Boa Vista';
  state.perfis.reembolso.referente = 'Viagem SP';
  chk('pasta_referente_sa', referenteFolderName('sagestao'), 'Voo Fazenda Boa Vista');
  chk('pasta_referente_arg', referenteFolderName('sagestao', 'Voo 02/09'), 'Voo 02 09');
  chk('pasta_referente_soma', referenteFolderName('reembolso'), '');   // Soma continua por Ano/Mês
  chk('pasta_referente_cartao', referenteFolderName('alelo'), '');
  state.perfis.sagestao.referente = '';
  chk('pasta_referente_sa_vazio', referenteFolderName('sagestao'), '');   // sem texto -> cai no Ano/Mês
  chk('flag_por_referente', String(!!MOD.sagestao.pastaPorReferente) + String(!!MOD.reembolso.pastaPorReferente), 'truefalse');
} catch(e){ fail++; out.push('THREW '+e.message); }

out.push(fail ? 'RESULT: FAIL ('+fail+')' : 'RESULT: PASS');
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
