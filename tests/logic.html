<!-- Testes de lógica pura (rode headless; ver CLAUDE.md > Verificação).
     Carrega os js/*.js e chama funções puras com fixtures. NÃO cobre OAuth/OCR/PDF/Drive. -->
<script src="../js/core.js"></script>
<script src="../js/render.js"></script>

</head><body><pre id="out">PENDING</pre>
<script>
var out = [], fail = 0;
function chk(name, got, exp){ var ok = String(got) === String(exp); if(!ok) fail++; out.push((ok?'PASS ':'FAIL ')+name+' => got['+got+'] exp['+exp+']'); }

try {
  // computeSantanderPeriodo
  chk('periodo_com_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[{alelo:[{data:'2026-05-28'}]},{alelo:[]}] }),
    '28/05/2026 a 20/06/2026');
  chk('periodo_sem_historico',
    computeSantanderPeriodo({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[] }),
    '05/06/2026 a 20/06/2026');
  chk('periodo_vazio', computeSantanderPeriodo({ alelo:[], history:[] }), '');

  // santanderPeriodoText: usuario escolheu datas -> prevalece sobre o automatico
  chk('periodo_texto_usuario',
    santanderPeriodoText({ alelo:[{data:'2026-06-05'}], history:[], santPeriodo:{start:'2026-06-01', end:'2026-06-30'} }),
    '01/06/2026 a 30/06/2026');
  chk('periodo_texto_fallback',
    santanderPeriodoText({ alelo:[{data:'2026-06-05'},{data:'2026-06-20'}], history:[], santPeriodo:{start:'', end:''} }),
    '05/06/2026 a 20/06/2026');

  // validateBeforeExport (confirm mockado)
  window.confirm = function(){ return false; };
  chk('valida_ok',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:10,estabelecimento:'X',justificativa:'Y'}], reembolso:[] }, {alelo:true,reembolso:false}),
    'true');
  chk('valida_falha',
    validateBeforeExport({ alelo:[{data:'2026-06-05',valor:0,estabelecimento:'',justificativa:''}], reembolso:[] }, {alelo:true,reembolso:false}),
    'false');

  // mergeDocs: perfil last-write-wins (profileUpdatedAt) + tabela por maior updatedAt
  function doc(profTs, func, reemb, tombReemb, reportMonths){
    return { meta:{profileUpdatedAt:profTs, updatedAt:profTs}, funcionario:func, dataSolicitacao:'', referente:'',
      reportMonths:reportMonths||{reembolso:'',alelo:''}, bank:{}, config:{categorias:[]}, reembolso:reemb||[], alelo:[],
      tomb:{reembolso:tombReemb||{}, alelo:{}}, history:[], histTomb:{}, driveFolders:{}, driveKnown:{}, driveDismissed:{}, pending:[] };
  }
  var a = doc(100, 'A', [{id:'x',data:'2026-01-01',valor:10,updatedAt:50}], {}, {reembolso:'2026-05',alelo:'2026-05'});
  var b = doc(200, 'B', [{id:'x',data:'2026-01-01',valor:99,updatedAt:80}], {}, {reembolso:'2026-06',alelo:'2026-07'});
  var m = mergeDocs(a, b);
  chk('merge_perfil_lww', m.funcionario, 'B');                 // 200 > 100
  chk('merge_tabela_maior_updatedAt', m.reembolso[0].valor, 99); // 80 > 50
  chk('merge_reportMonths_lww', m.reportMonths.reembolso + '|' + m.reportMonths.alelo, '2026-06|2026-07'); // perfil mais novo (b) vence

  // tombstone remove o lançamento (timestamps reais: lápide é purgada se < agora-180d)
  var NOW = Date.now();
  var c = doc(NOW, 'C', [{id:'x',data:'2026-01-01',valor:10,updatedAt:NOW - 5000}]);
  var d = doc(NOW, 'C', [], {x: NOW});   // lápide mais nova que o updatedAt, dentro da janela
  var m2 = mergeDocs(c, d);
  chk('merge_tombstone_remove', m2.reembolso.length, 0);

  // ---- Módulo Finanças ----
  // competência da fatura: compra até o dia de fechamento entra na fatura do mês
  var K = { id:'k1', diaFechamento:10, diaVencimento:20 };
  chk('fin_comp_no_fechamento', finCompetencia(K, '2026-06-10'), '2026-06');
  chk('fin_comp_apos_fechamento', finCompetencia(K, '2026-06-11'), '2026-07');
  chk('fin_comp_fechamento31_fev', finCompetencia({id:'k2',diaFechamento:31,diaVencimento:7}, '2026-02-28'), '2026-02');
  chk('fin_venc_apos_fechamento', finVencimentoISO(K, '2026-06'), '2026-06-20');
  chk('fin_venc_antes_fechamento', finVencimentoISO({id:'k3',diaFechamento:25,diaVencimento:5}, '2026-06'), '2026-07-05');

  // faturas: totais pessoal x reembolsável, pagamento abate e vira 'paga'
  var finTxs = [
    { id:'t1', cartaoId:'k1', data:'2026-06-05', valor:100, tipo:'despesa', categoria:'Mercado', reembolsavel:false },
    { id:'t2', cartaoId:'k1', data:'2026-06-05', valor:50,  tipo:'despesa', categoria:'Trabalho', reembolsavel:true },
    { id:'t3', contaId:'c1', pagamentoCartaoId:'k1', data:'2026-06-18', valor:150, tipo:'despesa', categoria:'Pagamento de fatura' },
    { id:'t4', contaId:'c1', data:'2026-06-01', valor:500, tipo:'receita', categoria:'Salário' },
    { id:'t5', contaId:'c1', data:'2026-06-02', valor:200, tipo:'despesa', categoria:'Lazer' }
  ];
  var fats = finFaturasDoCartao(K, finTxs, '2026-06-25');
  chk('fin_fatura_total', fats[0].total, 150);
  chk('fin_fatura_pessoal_reemb', fats[0].totalPessoal + '|' + fats[0].totalReembolsavel, '100|50');
  chk('fin_fatura_paga', fats[0].status, 'paga');
  chk('fin_fatura_aberta', finFaturasDoCartao(K, finTxs.slice(0,2), '2026-06-08')[0].status, 'aberta');

  // saldo da conta: saldoInicial + receitas - despesas (pagamento de fatura conta como despesa)
  chk('fin_saldo_conta', finSaldoConta({ id:'c1', saldoInicial:1000 }, finTxs), 1150);

  // resumo do mês: pagamento de fatura fica fora (gasto real já está nos itens do cartão)
  var res = finResumoMes(finTxs, '2026-06');
  chk('fin_resumo_mes', res.receitas + '|' + res.despesas, '500|350');
  chk('fin_resumo_categoria', res.porCategoria['Mercado'], 100);

  // dedupe de importação: mesma data+valor+descrição normalizada
  chk('fin_dedup_key', finDedupKey({ data:'2026-06-05', valor:12.5, descricao:'  Uber   X ' }), '2026-06-05|1250|uber x');
  var rows = [
    { data:'2026-06-05', valor:100, descricao:'MERCADO Y', incluir:true },
    { data:'2026-06-06', valor:80, descricao:'Novo', incluir:true }
  ];
  finMarcarDuplicados(rows, [{ cartaoId:'k1', data:'2026-06-05', valor:100, descricao:'mercado y' }], { cartaoId:'k1' });
  chk('fin_dedup_marca', rows[0].dup + '|' + rows[0].incluir + '|' + rows[1].dup, 'true|false|false');

  // cruzamento com reembolso: casa por valor + data dentro de ±5 dias (só despesa)
  var mrows = [
    { data:'2026-06-05', valor:100, tipo:'despesa' },
    { data:'2026-06-20', valor:50, tipo:'despesa' },
    { data:'2026-06-05', valor:100, tipo:'receita' }
  ];
  finMatchReembolsaveis(mrows, [{ data:'2026-06-07', valor:100 }]);
  chk('fin_match_reemb', (!!mrows[0].reembMatch) + '|' + (!!mrows[0].reembolsavel) + '|' + (!!mrows[1].reembMatch) + '|' + (!!mrows[2].reembMatch), 'true|true|false|false');

  // parcelas futuras: gera atual+1..total, uma por mês, grupo comum
  var prow = { data:'2026-06-05', valor:200, tipo:'despesa', categoria:'Mercado', parcela:{ atual:2, total:4, base:'GELADEIRA' } };
  var fut = finParcelasFuturas(prow, { cartaoId:'k1' }, 'g1');
  chk('fin_parc_len', fut.length, 2);
  chk('fin_parc_datas', fut[0].data + '|' + fut[1].data, '2026-07-05|2026-08-05');
  chk('fin_parc_desc_grupo', fut[0].descricao + '|' + fut[0].parcela.atual + '|' + fut[0].parcela.grupo + '|' + fut[0].cartaoId, 'GELADEIRA (3/4)|3|g1|k1');

  // dedupe de parcela ao reimportar: parcela nº já existente é detectada
  var txExist = [{ cartaoId:'k1', data:'2026-07-05', parcela:{ atual:3, total:4, grupo:'g1', base:'GELADEIRA' } }];
  chk('fin_parc_existe', finParcelaJaExiste(txExist, { cartaoId:'k1' }, 'GELADEIRA', 4, 3) + '|' + finParcelaJaExiste(txExist, { cartaoId:'k1' }, 'GELADEIRA', 4, 4), 'true|false');

  // meses da fatura (visão multi-mês): horizonte mínimo e cobertura das parcelas futuras
  var mesesTx = [
    { id:'p1', cartaoId:'k1', data:'2026-07-05', valor:200, tipo:'despesa', parcela:{ atual:3, total:4, grupo:'g1', base:'X' } },
    { id:'p2', cartaoId:'k1', data:'2026-09-05', valor:200, tipo:'despesa', parcela:{ atual:5, total:6, grupo:'g2', base:'X' } }
  ];
  var fmeses = finFaturaMeses(K, mesesTx, '2026-06-25', 6);
  chk('fin_meses_len', fmeses.length, 6);
  chk('fin_meses_inicio', fmeses[0].competencia + '|' + fmeses[0].temParcela, '2026-07|true');
  chk('fin_meses_cobre_parcela', finFaturaMeses(K, mesesTx, '2026-06-25', 2).slice(-1)[0].competencia, '2026-09');

  // merge: finTx segue mergeTable (maior updatedAt vence; lápide remove) e finConfig é LWW do perfil
  var fa2 = doc(100, 'A'); fa2.finConfig = { categorias: [{nome:'CatA', tipo:'despesa'}] };
  fa2.finTx = [{ id:'z', data:'2026-01-01', valor:10, updatedAt:50 }];
  fa2.tomb.finTx = {};
  var fb2 = doc(200, 'B'); fb2.finConfig = { categorias: [{nome:'CatB', tipo:'receita'}] };
  fb2.finTx = [{ id:'z', data:'2026-01-01', valor:77, updatedAt:90 }];
  fb2.tomb.finTx = {};
  var fm = mergeDocs(fa2, fb2);
  chk('fin_merge_tx_lww', fm.finTx[0].valor, 77);
  chk('fin_merge_config_lww', fm.finConfig.categorias[0].nome + '|' + fm.finConfig.categorias[0].tipo, 'CatB|receita');
  var fc2 = doc(NOW, 'C'); fc2.finTx = [{ id:'z', data:'2026-01-01', valor:10, updatedAt:NOW - 5000 }]; fc2.tomb.finTx = {};
  var fd2 = doc(NOW, 'C'); fd2.finTx = []; fd2.tomb.finTx = { z: NOW };
  chk('fin_merge_tombstone', mergeDocs(fc2, fd2).finTx.length, 0);

  // parsers de importação: CSV com cabeçalho acentuado e sinal, OFX com blocos STMTTRN
  var csv = 'Data;Descrição;Valor\n05/06/2026;MERCADO X;-123,45\n06/06/2026;PIX RECEBIDO;500,00';
  var pc = finParseCsv(csv);
  chk('fin_csv_len', pc.length, 2);
  chk('fin_csv_debito', pc[0].data + '|' + pc[0].valor + '|' + pc[0].tipo, '2026-06-05|123.45|despesa');
  chk('fin_csv_credito', pc[1].tipo + '|' + pc[1].descricao, 'receita|PIX RECEBIDO');
  var csvFat = 'data,descricao,valor\n2026-06-05,"LOJA A, LTDA","1.234,56"\n2026-06-07,LOJA B,"10,00"';
  var pf = finParseCsv(csvFat);
  chk('fin_csv_fatura_tudo_debito', pf.map(function(t){return t.tipo;}).join(','), 'despesa,despesa');
  chk('fin_csv_aspas_virgula', pf[0].descricao + '|' + pf[0].valor, 'LOJA A, LTDA|1234.56');
  var ofx = '<STMTTRN><TRNTYPE>DEBIT<DTPOSTED>20260605120000[-3:BRT]<TRNAMT>-45.90<MEMO>UBER TRIP</STMTTRN>' +
            '<STMTTRN><TRNTYPE>CREDIT<DTPOSTED>20260610<TRNAMT>1500.00<NAME>SALARIO</STMTTRN>';
  var po = finParseOfx(ofx);
  chk('fin_ofx_len', po.length, 2);
  chk('fin_ofx_debito', po[0].data + '|' + po[0].valor + '|' + po[0].tipo + '|' + po[0].descricao, '2026-06-05|45.9|despesa|UBER TRIP');
  chk('fin_ofx_credito', po[1].tipo + '|' + po[1].descricao, 'receita|SALARIO');

  // persistência do token do Drive: round-trip de token válido + rejeição de token expirado
  gdAccess = { token: 'tok123', exp: Date.now() + 100000 };
  saveGdAccess();
  chk('gdtoken_roundtrip', loadGdAccess().token, 'tok123');
  gdAccess = { token: 'tokOld', exp: Date.now() - 1000 };   // já expirado
  saveGdAccess();
  chk('gdtoken_expira', loadGdAccess().token, '');
  try { localStorage.removeItem(GDTOK_KEY); } catch(e){}
} catch(e){ fail++; out.push('THREW '+e.message); }

out.push(fail ? 'RESULT: FAIL ('+fail+')' : 'RESULT: PASS');
document.getElementById('out').textContent = out.join('\n');
</script>
