<!doctype html><html><head>
<!-- Teste de integridade do split (rode headless; ver CLAUDE.md > Verificação).
     Carrega os js/*.js na MESMA ordem do index.html e confere que cada arquivo definiu suas
     funções. Um SyntaxError/redeclaração pula o arquivo inteiro → a função some e vira FAIL.
     OBS: só checa `function` (vai p/ window); const/let de topo (scanProgress, MESES, $) não vão. -->
<script>window.__errs=[]; window.onerror=function(m,s,l){window.__errs.push(m+' @'+(s||'')+':'+l);};</script>
<script src="../js/modules.js"></script>
<script src="../js/core.js"></script>
<script src="../js/render.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/excel.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/lock.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/ocr.js"></script>
<script src="../js/idb.js"></script>
<script src="../js/drive-core.js"></script>
<script src="../js/drive-scan.js"></script>
<script src="../js/main.js"></script>
</head><body><pre id="out">PENDING</pre>
<script>
var checks = {
  'modules':    ['modOf','mapPorTabela','perfilVazio','normalizePerfil','perfilDe','docForModule','modulosSelecionados'],
  'core':       ['formatMoney','loadState','uid','getCatConfig','sumOf'],
  'render':     ['render','computeSantanderPeriodo','renderList','reopenHistory','monthLabelFor','allEntriesOf','renderCatSummary','renderReports','renderReportsPanel','histBelongsTo'],
  'modal':      ['openModal','saveEntry','deleteEntry','onPhotoSelected','toggleCamposModulo'],
  'excel':      ['buildXlsx','buildPrestacaoXlsx','buildXlsxFor','sheetTools','fileBaseOf','filteredDoc','resolveExport','docParaExport','validateBeforeExport','exportExcel','updateExportHint','recolorHex','pngSize','applyBrandToXlsx'],
  'pdf':        ['generatePdfBlob','buildPrestacaoPrint','exportPDF','buildPrint','buildPrintTable','buildSignatureBlock','applyPrintTheme'],
  'sync':       ['syncNow','mergeDocs','mergeTable','mergeHistory','setupSyncUI','perfisFromDoc','currentDoc','applyDoc'],
  'lock':       ['showLock','enableBio','setPin','setupBackupUI'],
  'ui':         ['setupNav','setupCatUI','populateCategorySelects','renderCatEditor','setupReportTabs','showReportTab','setupHistTabs','showHistTab','applyModuleAccent'],
  'ocr':        ['ocrReceipt','ocrReceiptRaw','blobSha256','fillFromOcr','setupAiUI'],
  'idb':        ['idbGet','idbPut','getPhotoBlob','compressImage','saveThumb'],
  'drive-core': ['gdUpload','gdEnsureFolder','gdRootName','purgeEntryPhoto','flushPendingPhotos','setupGDriveUI','loadGdAccess','saveGdAccess','scheduleGdRefresh','renderDriveFolders','ensureAllDriveFolders','driveFolderUrl'],
  'drive-scan': ['scanDriveForReceipts','gdListReceipts','renderPending','retryPendingOcr','openPendingEntry'],
  'main':       ['init','closeMonthFlow','closeTable','archiveMonthToDrive','setupTheme','bindField']
};
var out = [], fail = 0;
for (var file in checks) {
  var miss = checks[file].filter(function(fn){ return typeof window[fn] !== 'function'; });
  if (miss.length) fail++;
  out.push((miss.length ? 'FAIL ' : 'OK   ') + file + (miss.length ? ' missing: ' + miss.join(',') : ''));
}
out.push('ERRORS: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
out.push(fail || window.__errs.length ? 'RESULT: FAIL' : 'RESULT: PASS');
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
